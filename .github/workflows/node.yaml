name: Node CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: "24"
            deploy: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "${{ matrix.node-version }}"

      - name: Install deps
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build
        if: ${{ matrix.deploy }}
        run: npm run build

      - name: Install clasp
        if: ${{ matrix.deploy }}
        run: npm i -g @google/clasp

      - name: Write clasp credentials
        if: ${{ matrix.deploy }}
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Point clasp at the staging project
        if: ${{ matrix.deploy && github.ref != 'refs/heads/main' }}
        run: jq --arg id "${{ secrets.STAGING_SCRIPT_ID }}" '.scriptId = $id' .clasp.json > .clasp.json.tmp && mv .clasp.json.tmp .clasp.json

      - name: Push dist to Apps Script
        if: ${{ matrix.deploy }}
        run: clasp push --force
