name: Node CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: "18"
            deploy: false
          - node-version: "20"
            deploy: false
          - node-version: "22"
            deploy: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node-version }}"

      - name: Install deps
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build
        if: ${{ matrix.deploy && github.ref == 'refs/heads/main' }}
        run: npm run build

      - name: Install clasp
        if: ${{ matrix.deploy && github.ref == 'refs/heads/main' }}
        run: npm i -g @google/clasp

      - name: Write clasp credentials
        if: ${{ matrix.deploy && github.ref == 'refs/heads/main' }}
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Push dist to Apps Script
        if: ${{ matrix.deploy && github.ref == 'refs/heads/main' }}
        run: clasp push --force
